spring:
  application:
    name: educria-backend

  datasource:
    url: ${EDUCRIA_SQLSERVER_URL}
    username: ${EDUCRIA_SQLSERVER_USER:}
    password: ${EDUCRIA_SQLSERVER_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo
        use_nationalized_character_data: true
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/sqlserver/migration
    schemas: dbo

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

# JWT
educria:
  jwt:
    secret: ${EDUCRIA_JWT_SECRET}
    expiration-ms: 86400000 # 24 horas

logging:
  level:
    com.educria: DEBUG
    org.springframework.security: INFO
    # Mensagens do driver podem incluir valores de entrada. O handler da API registra a falha sem esses valores.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
